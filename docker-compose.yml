services:
  # Runs before neo4j on every `up`. No-op unless BACKUP names an archive in ./backups, e.g.
  #   docker compose down && BACKUP=illuminate-20260908-101500.tgz docker compose up
  # (or BACKUP=latest). Do not put BACKUP in .env — it would restore on every start.
  restore:
    image: python:3.12-alpine@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
    environment:
      BACKUP: ${BACKUP:-}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./scripts/restore.sh:/restore.sh:ro
      - ./backups:/backups:ro
      - neo4j-data:/neo4j
      - ./api/data:/api-data
    command: sh /restore.sh

  # `make backup` (or `docker compose run --rm backup`) with neo4j stopped.
  backup:
    image: python:3.12-alpine@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
    profiles: [tools]
    environment:
      NAME: ${NAME:-}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - neo4j-data:/neo4j:ro
      - ./api/data:/api-data:ro
    command: sh /backup.sh

  neo4j:
    image: neo4j:5@sha256:037cf5756f0135cbfd66b739b6df7c7c4bb100f9ce11602f6f9538e17e02c74d
    container_name: illuminate-neo4j
    depends_on:
      restore:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your local environment}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./api
    container_name: illuminate-api
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your local environment}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your local environment}
      ILLUMINATE_DATA_DIR: /data
      ILLUMINATE_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      # Fixture-mode startup is allowed without a cache authority. Live retrieval
      # still fails closed because ILLUMINATE_FETCH_CACHE_REQUIRED remains true.
      ILLUMINATE_FETCH_CACHE_URL: ${ILLUMINATE_FETCH_CACHE_URL:-}
      ILLUMINATE_FETCH_CACHE_NAMESPACE: ${ILLUMINATE_FETCH_CACHE_NAMESPACE:-illuminate-v1}
      ILLUMINATE_FETCH_CACHE_TOKEN: ${ILLUMINATE_FETCH_CACHE_TOKEN:-${SESSION_SECRET}}
      ILLUMINATE_FETCH_CACHE_REQUIRED: "true"
      ILLUMINATE_FETCH_CACHE_AUTHORITY_ENABLED: ${ILLUMINATE_FETCH_CACHE_AUTHORITY_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      # Same directory the host-side API uses, so keys and settings are shared and backed up.
      - ./api/data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Database readiness is separate from judged-workflow readiness. A fresh graph
      # may report primary_workflow_ready=false until `make seed`, but `ok` confirms
      # the API can reach Neo4j with the configured credentials.
      test: ["CMD-SHELL", "python -c \"import json, urllib.request; h=json.load(urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)); assert h['ok']\""]
      interval: 5s
      timeout: 7s
      retries: 12

  web:
    build: ./web
    container_name: illuminate-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ | grep -q '<div id=\"app\"></div>'"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  neo4j-data:
