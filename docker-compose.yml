services:
  # Runs before neo4j on every `up`. No-op unless BACKUP names an archive in ./backups, e.g.
  #   docker compose down && BACKUP=illuminate-20260908-101500.tgz docker compose up
  # (or BACKUP=latest). Do not put BACKUP in .env — it would restore on every start.
  restore:
    image: python:3.12-alpine
    environment:
      BACKUP: ${BACKUP:-}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./scripts/restore.sh:/restore.sh:ro
      - ./backups:/backups:ro
      - neo4j-data:/neo4j
      - ./api/data:/api-data
    command: sh /restore.sh

  # `make backup` (or `docker compose run --rm backup`) with neo4j stopped.
  backup:
    image: python:3.12-alpine
    profiles: [tools]
    environment:
      NAME: ${NAME:-}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - neo4j-data:/neo4j:ro
      - ./api/data:/api-data:ro
    command: sh /backup.sh

  neo4j:
    image: neo4j:5
    container_name: illuminate-neo4j
    depends_on:
      restore:
        condition: service_completed_successfully
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/illuminate-dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./api
    container_name: illuminate-api
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: illuminate-dev
      ILLUMINATE_DATA_DIR: /data
      ILLUMINATE_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      # Same directory the host-side API uses, so keys and settings are shared and backed up.
      - ./api/data:/data
    ports:
      - "8000:8000"

  web:
    build: ./web
    container_name: illuminate-web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  neo4j-data:
