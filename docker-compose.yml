services:
  neo4j:
    image: neo4j:5
    container_name: illuminate-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/illuminate-dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./api
    container_name: illuminate-api
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: illuminate-dev
      ILLUMINATE_DATA_DIR: /data
      ILLUMINATE_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"

  web:
    build: ./web
    container_name: illuminate-web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  neo4j-data:
  api-data:
