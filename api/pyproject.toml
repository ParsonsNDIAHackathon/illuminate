[project]
name = "illuminate"
version = "0.1.0"
description = "One graph, any consumer — supplier-network intelligence (NDIA hackathon, UC-7 / UC-11)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "neo4j>=5.25",
  "pydantic>=2.9",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "openai>=1.50",
  "cryptography>=43",
  "mcp>=1.2",
  "rapidfuzz>=3.9",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
illuminate-api = "illuminate.main:run"
illuminate-mcp = "illuminate.mcp_server:run"
illuminate-seed = "illuminate.seed.seed:main"
illuminate-validate-sources = "illuminate.connectors.validation:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["illuminate*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live_sources: opt-in bounded read-only checks against configured upstream services",
]
