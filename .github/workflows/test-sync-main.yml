name: Test main synchronization

on:
  pull_request:
    paths:
      - ".github/workflows/test-sync-main.yml"
      - "scripts/sync-main.sh"
      - "scripts/test-sync-main.sh"
      - "scripts/post-merge.sh"
      - "Makefile"
      - "README.md"
      - "replit.md"
      - "docs/ONBOARDING.md"

permissions:
  contents: read

jobs:
  disposable-repository-scenarios:
    name: Disposable repository synchronization scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run synchronization scenarios
        env:
          # The suite supplies a fake token only to its local Git wrapper.
          # It must not inherit repository credentials or contact origin.
          GITHUB_KEY: ""
        run: make test-sync-main